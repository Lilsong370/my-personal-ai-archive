name: Capture

# 任何外部工具 POST 到 repository_dispatch，即可把内容写进 journal/
# curl -X POST https://api.github.com/repos/Lilsong370/my-personal-ai-archive/dispatches \
#   -H "Authorization: Bearer <PAT>" -H "Accept: application/vnd.github+json" \
#   -d '{"event_type":"capture","client_payload":{"text":"内容","tag":"claude","title":"主题"}}'

on:
  repository_dispatch:
    types: [capture]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append to journal
        uses: actions/github-script@v7
        env:
          TEXT: ${{ github.event.client_payload.text }}
          TAG: ${{ github.event.client_payload.tag }}
          TITLE: ${{ github.event.client_payload.title }}
        with:
          script: |
            const fs = require('fs');
            const text = (process.env.TEXT || '').trim();
            const tag = (process.env.TAG || 'external').trim();
            const title = (process.env.TITLE || '').trim();
            if (!text) {
              core.setFailed('client_payload.text 为空');
              return;
            }
            const [date, time] = new Date()
              .toLocaleString('sv-SE', { timeZone: 'Asia/Shanghai' })
              .split(' ')
              .map(s => s.trim());
            const hhmm = time.slice(0, 5);
            const ym = date.slice(0, 7);
            const dir = `journal/${ym}`;
            fs.mkdirSync(dir, { recursive: true });
            const file = `${dir}/${date}.md`;
            if (!fs.existsSync(file)) fs.writeFileSync(file, `# ${date} · 对话记录\n`, 'utf8');
            const head = `## ${hhmm} · ${tag}` + (title ? ` · ${title}` : '');
            fs.appendFileSync(file, `\n${head}\n\n${text}\n`, 'utf8');
            core.info(`appended to ${file}`);

      - name: Commit
        run: |
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add journal
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "archive(external): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
